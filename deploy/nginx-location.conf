# Include INSIDE the existing HTTPS server block.
# Keep the existing / location and certificate configuration.
location = /quant-learn {
    return 308 /quant-learn/$is_args$args;
}

location ^~ /quant-learn/ {
    root /var/www;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
}
